<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa ao Clicar</title>
    <style>
        /* Estilo da caixa oculta */
        .caixa {
            display: none; /* Inicialmente invisível */
            width: 300px;
            height: 200px;
            background-color: lightblue;
            border: 2px solid blue;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        /* Estilo do botão */
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Botão -->
    <button id="mostrarCaixa">Mostrar Caixa</button>

    <!-- Caixa oculta -->
    <div id="minhaCaixa" class="caixa">
        <p>Olá! Esta é uma caixa que apareceu!</p>
        <button id="fecharCaixa">Fechar</button>
    </div>

    <script>
        // Seleciona os elementos
        const botaoMostrar = document.getElementById('mostrarCaixa');
        const caixa = document.getElementById('minhaCaixa');
        const botaoFechar = document.getElementById('fecharCaixa');

        // Função para mostrar a caixa
        botaoMostrar.addEventListener('click', () => {
            caixa.style.display = 'block';
        });

        // Função para fechar a caixa
        botaoFechar.addEventListener('click', () => {
            caixa.style.display = 'none';
        });
    </script>
</body>
</html>
